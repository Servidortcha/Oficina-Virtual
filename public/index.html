<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Virtual 2D</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div id="ui">
    <div id="overlay">
      <h1>Oficina Virtual 2D</h1>
      <p>Elige tu nombre para entrar</p>
      <input type="text" id="playerName" placeholder="Tu nombre" maxlength="20">
      <button id="joinBtn">Entrar a la oficina</button>
      <div id="joinError"></div>
    </div>
    <div id="status">Conectando...</div>
    <div id="chat">
      <div id="messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
        <button id="sendBtn">Enviar</button>
      </div>
    </div>
  </div>
  <div id="game"></div>
  <script src="client.js"></script>
</body>
</html>
